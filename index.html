<!DOCTYPE html>
<html>
<head>
    <title>Rheinblick Tour Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Base Setup - Dark Mode */
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: white; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; background: #000;
        }
        
        /* Unsichtbares Touchpad für Joystick-Modus */
        #touchPad {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1500; display: none; cursor: move; touch-action: none;
        }

        /* Oben: Loch-Leiste (Transparent & Floating) */
        .controls-top {
            position: absolute; top: 8px; left: 0; right: 0; 
            padding-top: env(safe-area-inset-top); 
            z-index: 1000; display: flex; gap: 6px; overflow-x: auto; 
            padding-left: 10px; padding-right: 10px; scrollbar-width: none;
            pointer-events: auto;
        }
        .controls-top::-webkit-scrollbar { display: none; }
        
        .btn-hole {
            background: rgba(0,0,0,0.6); color: #ccc; border: 1px solid rgba(255,255,255,0.2); 
            backdrop-filter: blur(5px); padding: 8px 14px; 
            border-radius: 8px; font-weight: bold; flex-shrink: 0; font-size: 15px; margin-top: 5px;
        }
        .btn-hole.active { background: #007AFF; color: white; border-color: #007AFF; opacity: 1; }

        /* HUD Container */
        .hud-container {
            position: absolute; top: 65px; left: 10px; right: 10px; z-index: 900;
            pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start;
            padding-top: env(safe-area-inset-top);
        }

        .hud-left, .hud-right { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
        .hud-right { align-items: flex-end; }
        
        /* Badges (Floating Look) */
        .hud-badge {
            background: rgba(0, 0, 0, 0.7); padding: 8px 12px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; min-width: 80px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .gps-val { font-size: 24px; font-weight: 800; color: white; line-height: 1; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .gps-label { font-size: 10px; color: #bbb; text-transform: uppercase; font-weight: 700; margin-top: 2px; }
        .sub-dist { font-size: 11px; color: #4CD964; font-weight: 600; margin-top: 4px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px; }

        /* Modifier Badge */
        .mod-badge {
            padding: 6px 10px; font-size: 12px; font-weight: 700; display: none; 
            flex-direction: row; align-items: center; justify-content: space-between; gap: 8px;
            border: 1px solid #FFD60A; color: #FFD60A; background: rgba(0,0,0,0.8);
        }
        .btn-close-mod {
            background: rgba(255, 69, 58, 0.3); color: #FF453A; border: none; border-radius: 50%; 
            width: 20px; height: 20px; font-size: 10px; font-weight: bold;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }

        /* Rechte Buttons (Glassmorphism) */
        .btn-icon-square {
            background: rgba(0, 0, 0, 0.6); width: 46px; height: 46px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(8px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-icon-square:active { transform: scale(0.95); background: rgba(0,0,0,0.8); }
        .btn-icon-square.active { background: #007AFF; border-color: #007AFF; }
        .icon-lg { font-size: 22px; line-height: 1; }
        .icon-lbl { font-size: 9px; color: #ccc; text-transform: uppercase; margin-top: 2px; font-weight: 600; }
        .btn-icon-square.active .icon-lbl { color: white; }

        /* Unten: Schläger Leiste (FLOATING - KEIN BALKEN) */
        .controls-bottom { 
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: transparent;
            padding: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }
        
        .club-container {
            display: flex; overflow-x: auto; gap: 10px; 
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
            pointer-events: auto; /* Buttons wieder klickbar */
            padding: 5px 15px;
            max-width: 100%;
        }
        .club-container::-webkit-scrollbar { display: none; }
        
        .club-card {
            background: rgba(0, 0, 0, 0.75); padding: 12px 0; border-radius: 14px; 
            text-align: center; border: 1px solid rgba(255,255,255,0.15); cursor: pointer;
            backdrop-filter: blur(10px);
            display: inline-block; width: 75px; flex-shrink: 0; color: #eee;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        /* Aktiver Schläger: Blau & Grösser */
        .club-card.selected { 
            border-color: #007AFF; background: #007AFF; color: white;
            box-shadow: 0 0 15px rgba(0,122,255,0.6); transform: scale(1.05);
        }
        .club-card.selected .club-dist { color: white; opacity: 1; }
        .club-name { font-weight: 800; font-size: 16px; display: block; }
        .club-dist { font-size: 11px; color: #999; display: block; margin-top: 3px; font-weight: 600; }

        /* Calibration Button (Schwebt über Schlägern) */
        .calib-btn-container {
            position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%); z-index: 950;
            pointer-events: auto;
        }
        .btn-calib {
            background: #FFD60A; color: black; border: none; padding: 10px 24px;
            border-radius: 24px; font-weight: 800; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            font-size: 15px; display: flex; align-items: center; gap: 8px;
        }
        
        /* FERTIG Button */
        #stopRemoteBtn {
            display: none; position: absolute; bottom: 85px; left: 50%; transform: translateX(-50%);
            z-index: 1600; background: #FF3B30; color: white; border: none; padding: 10px 24px;
            border-radius: 24px; font-weight: 800; font-size: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            display: flex; align-items: center; gap: 8px;
        }

        /* Modals */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 2000; 
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: #1c1c1e; width: 85%; max-height: 80%; overflow-y: auto;
            border-radius: 18px; padding: 20px; border: 1px solid #333; text-align: center;
        }
        
        /* Distanz Tabelle */
        .dist-table { width: 100%; border-collapse: collapse; margin-top: 10px; color: #eee; font-size: 15px; }
        .dist-table th { border-bottom: 1px solid #444; padding: 8px; color: #888; font-size: 11px; text-transform: uppercase; }
        .dist-table th:first-child { text-align: left; padding-left: 10px; }
        .dist-table td { border-bottom: 1px solid #333; padding: 12px 8px; font-weight: 600; }
        .dist-table td:first-child { text-align: left; padding-left: 10px; font-weight: 800; color: #007AFF; }
        .dist-table td:nth-child(2), .dist-table td:nth-child(3) { text-align: center; }

        /* Wind Menu */
        .wind-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn-wind-opt { 
            flex: 1; padding: 14px; background: #2c2c2e; border: 1px solid #3a3a3c; 
            color: #aaa; border-radius: 12px; font-weight: 700; font-size: 13px;
        }
        .btn-wind-opt.active { background: #007AFF; color: white; border-color: #007AFF; }
        
        #loader { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3000; 
            display: none; flex-direction: column; justify-content: center; align-items: center; color: white; 
        }

        .map-label { color: white; font-weight: 800; text-shadow: 0 1px 4px black; font-size: 12px; text-align: center; pointer-events: none; letter-spacing: 0.5px; }
        
        /* Marker Styles */
        .tee-marker { background: white; border: 4px solid #333; border-radius: 50%; width: 18px; height: 18px; box-shadow: 0 0 5px black; }
        .tee-marker.gps-active {
            border-color: #007AFF; box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.4);
            animation: pulse-blue 2s infinite;
        }
        @keyframes pulse-blue { 0% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(0, 122, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(0, 122, 255, 0); } }

        /* PIN Styles - PERFORMANCE OPTIMIZED */
        .custom-pin {
            background-color: #007AFF; width: 24px; height: 24px; 
            border: 3px solid white; border-radius: 50%; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            /* WICHTIG: Keine Transition für flüssiges Bewegen! */
            transition: none !important; 
        }
        /* Nur beim Mode-Wechsel darf es kurz animieren (via transform) */
        .custom-pin.mode-switch {
             transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s !important;
        }
        .custom-pin.active {
            background-color: #FF3B30; border-color: #FFD60A;
            transform: scale(1.4); 
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.6);
            z-index: 9999 !important;
        }
    </style>
</head>
<body>

<div id="loader">
    <h2>🚀 Lade Karten...</h2>
    <div id="loadStatus" style="color:#888; margin-top:5px;">0 / 18</div>
</div>

<div id="map"></div>

<div id="touchPad"></div>
<button id="stopRemoteBtn" onclick="toggleRemoteMode()">FERTIG</button>

<div class="hud-container">
    <div class="hud-left">
        <div class="hud-badge">
            <div>
                <div class="gps-val" id="gpsDistDisplay">--</div>
                <div class="gps-label">GPS Ziel</div>
            </div>
            <div>
                <div class="sub-dist" id="greenDistDisplay">-- m Grün</div>
            </div>
        </div>
        
        <div class="hud-badge mod-badge" id="calibBadge">
            <span id="calibText">PlaysLike</span>
            <button class="btn-close-mod" onclick="resetCalibration()">✕</button>
        </div>

        <div class="hud-badge mod-badge" id="windBadge" style="border-color: #0A84FF; color: #0A84FF;">
            <span id="windText">Wind</span>
            <button class="btn-close-mod" onclick="resetWind()">✕</button>
        </div>
    </div>

    <div class="hud-right">
        <div class="btn-icon-square" id="btnGPS" onclick="toggleGPS()">
            <span class="icon-lg">🛰️</span>
            <span class="icon-lbl">GPS</span>
        </div>

        <div class="btn-icon-square" onclick="openWindModal()">
            <span class="icon-lg" id="windIconDisplay">💨</span>
            <span class="icon-lbl">Wind</span>
        </div>
        
        <div class="btn-icon-square" onclick="openSettingsModal()">
            <span class="icon-lg">⚙️</span>
            <span class="icon-lbl">Menu</span>
        </div>
    </div>
</div>

<div class="calib-btn-container" id="calibContainer">
    <button class="btn-calib" onclick="calibrateShot()">🎯 Kalibrieren</button>
</div>

<div class="controls-top" id="holeNav"></div>

<div class="controls-bottom">
    <div id="clubScroll" class="club-container"></div>
</div>

<div id="windModal" class="modal-overlay" onclick="closeWindModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 style="margin-top:0; color:#eee;">Wind Setup</h3>
        <div class="wind-row">
            <button class="btn-wind-opt" id="ws-1" onclick="setWindStrength(1)">Leicht</button>
            <button class="btn-wind-opt" id="ws-2" onclick="setWindStrength(2)">Mittel</button>
            <button class="btn-wind-opt" id="ws-3" onclick="setWindStrength(3)">Stark</button>
        </div>
        <div class="wind-row">
            <button class="btn-wind-opt" id="wd-head" onclick="setWindDir('head')">⬇️ Gegen</button>
            <button class="btn-wind-opt" id="wd-tail" onclick="setWindDir('tail')">⬆️ Rücken</button>
        </div>
        <div class="wind-row">
            <button class="btn-wind-opt" id="wd-left" onclick="setWindDir('left')">⬅️ Links</button>
            <button class="btn-wind-opt" id="wd-right" onclick="setWindDir('right')">➡️ Rechts</button>
        </div>
    </div>
</div>

<div id="settingsModal" class="modal-overlay" onclick="closeSettingsModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 style="margin-top:0; color:#eee;">Einstellungen</h3>
        
        <button onclick="preloadMapAction()" style="width:100%; padding:14px; background:#34C759; color:white; border:none; border-radius:12px; font-weight:bold; margin-bottom:20px; box-shadow:0 4px 15px rgba(52,199,89,0.4);">
            🌍 Karten Offline laden
        </button>

        <h4 style="color:#888; text-align:left; border-bottom:1px solid #444; padding-bottom:8px; margin-bottom:0;">Meine Distanzen</h4>
        <div style="max-height: 45vh; overflow-y: auto;">
            <table class="dist-table">
                <thead><tr><th>Schläger</th><th>Carry</th><th>Total</th></tr></thead>
                <tbody id="distTableBody"></tbody>
            </table>
        </div>
        <button onclick="closeSettingsModal()" style="width:100%; padding:12px; background:#333; color:white; border:none; border-radius:12px; margin-top:20px;">Schliessen</button>
    </div>
</div>

<div id="selectModal" class="modal-overlay" style="display:none;"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>

<script>
    // --- DATEN ---
    var clubs = [
        { id: 'drv', name: "Driver", carry: 180, total: 240, spreadFactor: 0.43 }, 
        { id: 'safe',name: "Dr Safe",carry: 150, total: 205, spreadFactor: 0.30 },
        { id: 'i5',  name: "E 5",    carry: 151, total: 185, spreadFactor: 0.28 },
        { id: 'i6',  name: "E 6",    carry: 145, total: 160, spreadFactor: 0.28 },
        { id: 'i7',  name: "E 7",    carry: 135, total: 147, spreadFactor: 0.25 },
        { id: 'i8',  name: "E 8",    carry: 130, total: 139, spreadFactor: 0.25 },
        { id: 'i9',  name: "E 9",    carry: 118, total: 125, spreadFactor: 0.25 },
        { id: 'pw',  name: "PW",     carry: 74,  total: 82,  spreadFactor: 0.20 },
        { id: '52',  name: "52°",    carry: 60,  total: 66,  spreadFactor: 0.20 },
        { id: '56',  name: "56°",    carry: 51,  total: 57,  spreadFactor: 0.20 },
        { id: '60',  name: "60°",    carry: 45,  total: 51,  spreadFactor: 0.20 }
    ];

    var courseData = { "type": "FeatureCollection", "features": [
        {"properties": {"hole": 1, "type": "tee"}, "geometry": {"coordinates": [8.5834326, 47.6052646], "type": "Point"}}, {"properties": {"hole": 1, "type": "green"}, "geometry": {"coordinates": [8.5829612, 47.6022372], "type": "Point"}},
        {"properties": {"hole": 2, "type": "tee"}, "geometry": {"coordinates": [8.5813978, 47.6019081], "type": "Point"}}, {"properties": {"hole": 2, "type": "green"}, "geometry": {"coordinates": [8.5765332, 47.5993862], "type": "Point"}},
        {"properties": {"hole": 3, "type": "tee"}, "geometry": {"coordinates": [8.5762960, 47.5999531], "type": "Point"}}, {"properties": {"hole": 3, "type": "green"}, "geometry": {"coordinates": [8.5794733, 47.6018246], "type": "Point"}},
        {"properties": {"hole": 4, "type": "tee"}, "geometry": {"coordinates": [8.5788212, 47.6021396], "type": "Point"}}, {"properties": {"hole": 4, "type": "green"}, "geometry": {"coordinates": [8.5764517, 47.6021276], "type": "Point"}},
        {"properties": {"hole": 5, "type": "tee"}, "geometry": {"coordinates": [8.5750503, 47.6022611], "type": "Point"}}, {"properties": {"hole": 5, "type": "green"}, "geometry": {"coordinates": [8.5691882, 47.6002142], "type": "Point"}},
        {"properties": {"hole": 6, "type": "tee"}, "geometry": {"coordinates": [8.5667921, 47.6013943], "type": "Point"}}, {"properties": {"hole": 6, "type": "green"}, "geometry": {"coordinates": [8.5711069, 47.6027466], "type": "Point"}},
        {"properties": {"hole": 7, "type": "tee"}, "geometry": {"coordinates": [8.5711889, 47.6022817], "type": "Point"}}, {"properties": {"hole": 7, "type": "green"}, "geometry": {"coordinates": [8.5757785, 47.6026588], "type": "Point"}},
        {"properties": {"hole": 8, "type": "tee"}, "geometry": {"coordinates": [8.5786511, 47.6025721], "type": "Point"}}, {"properties": {"hole": 8, "type": "green"}, "geometry": {"coordinates": [8.5806936, 47.6026511], "type": "Point"}},
        {"properties": {"hole": 9, "type": "tee"}, "geometry": {"coordinates": [8.5813072, 47.6024850], "type": "Point"}}, {"properties": {"hole": 9, "type": "green"}, "geometry": {"coordinates": [8.5825017, 47.6054780], "type": "Point"}},
        {"properties": {"hole": 10, "type": "tee"}, "geometry": {"coordinates": [8.5812327, 47.6058251], "type": "Point"}}, {"properties": {"hole": 10, "type": "green"}, "geometry": {"coordinates": [8.5764033, 47.6046821], "type": "Point"}},
        {"properties": {"hole": 11, "type": "tee"}, "geometry": {"coordinates": [8.5739872, 47.6051346], "type": "Point"}}, {"properties": {"hole": 11, "type": "green"}, "geometry": {"coordinates": [8.5753398, 47.6062346], "type": "Point"}},
        {"properties": {"hole": 12, "type": "tee"}, "geometry": {"coordinates": [8.5749990, 47.6064747], "type": "Point"}}, {"properties": {"hole": 12, "type": "green"}, "geometry": {"coordinates": [8.5717002, 47.6035892], "type": "Point"}},
        {"properties": {"hole": 13, "type": "tee"}, "geometry": {"coordinates": [8.5710394, 47.6032794], "type": "Point"}}, {"properties": {"hole": 13, "type": "green"}, "geometry": {"coordinates": [8.5662021, 47.6033664], "type": "Point"}},
        {"properties": {"hole": 14, "type": "tee"}, "geometry": {"coordinates": [8.5662565, 47.6037057], "type": "Point"}}, {"properties": {"hole": 14, "type": "green"}, "geometry": {"coordinates": [8.5704874, 47.6048594], "type": "Point"}},
        {"properties": {"hole": 15, "type": "tee"}, "geometry": {"coordinates": [8.5712680, 47.6048053], "type": "Point"}}, {"properties": {"hole": 15, "type": "green"}, "geometry": {"coordinates": [8.5713225, 47.6037013], "type": "Point"}},
        {"properties": {"hole": 16, "type": "tee"}, "geometry": {"coordinates": [8.5730384, 47.6033288], "type": "Point"}}, {"properties": {"hole": 16, "type": "green"}, "geometry": {"coordinates": [8.5789288, 47.6030757], "type": "Point"}},
        {"properties": {"hole": 17, "type": "tee"}, "geometry": {"coordinates": [8.5784016, 47.6034629], "type": "Point"}}, {"properties": {"hole": 17, "type": "green"}, "geometry": {"coordinates": [8.5767782, 47.6039360], "type": "Point"}},
        {"properties": {"hole": 18, "type": "tee"}, "geometry": {"coordinates": [8.5780394, 47.6038951], "type": "Point"}}, {"properties": {"hole": 18, "type": "green"}, "geometry": {"coordinates": [8.5815836, 47.6053742], "type": "Point"}}
    ]};

    var calibFactor = 1.0; 
    var windStrength = 0; 
    var windDir = 'none';

    // --- SETUP ---
    var map = L.map('map', {zoomControl: false, attributionControl: false}).setView([0,0], 2);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom: 19}).addTo(map);
    var shotLayer = L.layerGroup().addTo(map);
    var uiLayer = L.layerGroup().addTo(map);

    var holeNav = document.getElementById('holeNav');
    for(let i=1; i<=18; i++) {
        let btn = document.createElement('button');
        btn.className = 'btn-hole'; btn.innerText = i; btn.id = 'h'+i;
        btn.onclick = () => loadHole(i);
        holeNav.appendChild(btn);
    }

    var currentClub, startPoint, greenPoint, targetMarker, startMarker;
    var remoteActive = false; 
    var gpsActive = false;
    var gpsWatchId = null;
    var currentHoleNum = 1;

    // --- LOGIK ---
    function loadHole(num) {
        currentHoleNum = num;
        document.querySelectorAll('.btn-hole').forEach(b => b.classList.remove('active'));
        document.getElementById('h'+num).classList.add('active');

        var tee = courseData.features.find(f => f.properties.hole === num && f.properties.type === 'tee');
        var green = courseData.features.find(f => f.properties.hole === num && f.properties.type === 'green');
        if(!tee || !green) return;

        startPoint = [tee.geometry.coordinates[1], tee.geometry.coordinates[0]];
        greenPoint = [green.geometry.coordinates[1], green.geometry.coordinates[0]];

        calibFactor = 1.0; updateCalibUI();
        stopGPS(false); // Reset GPS, kein Autojump nötig da wir eh setzen

        uiLayer.clearLayers();
        shotLayer.clearLayers();

        // Start Marker (Weiss)
        startMarker = L.marker(startPoint, { draggable: true, icon: L.divIcon({ className: 'tee-marker', iconSize:[18,18] }) })
         .addTo(uiLayer).on('drag', e => { 
             startPoint = [e.latlng.lat, e.latlng.lng]; 
             stopGPS(false); // Manuelles Ziehen = GPS Aus (ohne Reset)
             updateShotPattern(); 
         });

        var distToGreen = turf.distance(turf.point([startPoint[1], startPoint[0]]), turf.point([greenPoint[1], greenPoint[0]]), {units:'meters'});
        var idealIdx = getIdealClubIndex(distToGreen);
        currentClub = clubs[idealIdx];

        var bearing = turf.bearing(turf.point([startPoint[1], startPoint[0]]), turf.point([greenPoint[1], greenPoint[0]]));
        var landGeo = turf.destination(turf.point([startPoint[1], startPoint[0]]), currentClub.total/1000, bearing);
        
        var pinIcon = L.divIcon({ className: 'custom-pin', iconSize: [24, 24], iconAnchor: [12, 12] });
        
        targetMarker = L.marker([landGeo.geometry.coordinates[1], landGeo.geometry.coordinates[0]], {icon: pinIcon, draggable:true, zIndexOffset: 2000}).addTo(uiLayer);
        targetMarker.on('click', toggleRemoteMode);
        targetMarker.on('drag', updateShotPattern);

        map.fitBounds([startPoint, greenPoint], {padding: [40, 40], animate: false});
        renderClubScroll(idealIdx);
        setTimeout(() => updateShotPattern(), 100);
    }

    // --- GPS TRACKING ---
    function toggleGPS() {
        if(gpsActive) { stopGPS(true); return; } // True = Jump back to Tee
        
        if(!navigator.geolocation) { alert("GPS nicht verfügbar"); return; }
        
        gpsActive = true;
        document.getElementById('btnGPS').classList.add('active');
        if(startMarker) startMarker.getElement().classList.add('gps-active');

        gpsWatchId = navigator.geolocation.watchPosition(
            (pos) => {
                var lat = pos.coords.latitude;
                var lng = pos.coords.longitude;
                if(pos.coords.accuracy < 60) {
                    startPoint = [lat, lng];
                    startMarker.setLatLng(startPoint);
                    updateShotPattern();
                }
            },
            (err) => { console.log(err); stopGPS(true); },
            { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
        );
    }

    function stopGPS(resetToTee) {
        gpsActive = false;
        document.getElementById('btnGPS').classList.remove('active');
        if(gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId);
        
        if(startMarker) {
            var el = startMarker.getElement();
            if(el) el.classList.remove('gps-active');
            
            // Wenn explizit ausgeschaltet (Button), springe zurück zum Tee
            if(resetToTee) {
                var tee = courseData.features.find(f => f.properties.hole === currentHoleNum && f.properties.type === 'tee');
                if(tee) {
                    startPoint = [tee.geometry.coordinates[1], tee.geometry.coordinates[0]];
                    startMarker.setLatLng(startPoint);
                    updateShotPattern();
                }
            }
        }
    }

    // --- REMOTE TOUCH CONTROL ---
    function toggleRemoteMode() {
        remoteActive = !remoteActive;
        var pad = document.getElementById('touchPad');
        var btn = document.getElementById('stopRemoteBtn');
        var calib = document.getElementById('calibContainer');
        var pinIconDiv = targetMarker.getElement();

        if(remoteActive) {
            pad.style.display = 'block';
            btn.style.display = 'block';
            calib.style.display = 'none'; 
            if(pinIconDiv) {
                pinIconDiv.classList.add('mode-switch'); // Enable transition
                setTimeout(() => { pinIconDiv.classList.add('active'); }, 10);
            }
            map.dragging.disable(); 
        } else {
            pad.style.display = 'none';
            btn.style.display = 'none';
            calib.style.display = 'block';
            if(pinIconDiv) {
                pinIconDiv.classList.remove('active');
                setTimeout(() => { pinIconDiv.classList.remove('mode-switch'); }, 200); // Remove transition after anim
            }
            map.dragging.enable();
        }
    }

    var touchPad = document.getElementById('touchPad');
    var lastX, lastY;

    function handleInputStart(x, y) { lastX = x; lastY = y; }
    function handleInputMove(x, y) {
        if(!remoteActive) return;
        var dx = x - lastX; var dy = y - lastY;
        
        var currentLatLng = targetMarker.getLatLng();
        var point = map.latLngToContainerPoint(currentLatLng);
        var newPoint = L.point(point.x + dx, point.y + dy);
        var newLatLng = map.containerPointToLatLng(newPoint);
        
        targetMarker.setLatLng(newLatLng);
        updateShotPattern();
        lastX = x; lastY = y;
    }

    touchPad.addEventListener('mousedown', e => handleInputStart(e.clientX, e.clientY));
    touchPad.addEventListener('mousemove', e => { if(e.buttons === 1) handleInputMove(e.clientX, e.clientY); });
    
    touchPad.addEventListener('touchstart', e => { handleInputStart(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive: false});
    touchPad.addEventListener('touchmove', e => { handleInputMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }, {passive: false});

    // --- ACTIONS ---
    function calibrateShot() {
        var tPos = targetMarker.getLatLng();
        var sPos = L.latLng(startPoint);
        var gpsDist = turf.distance(turf.point([sPos.lng, sPos.lat]), turf.point([tPos.lng, tPos.lat]), {units: 'meters'});
        
        var input = prompt("Garmin PlaysLike Distanz:", Math.round(gpsDist));
        if(input != null && input > 0) {
            calibFactor = parseInt(input) / gpsDist;
            updateCalibUI();
            var idealIdx = getIdealClubIndex(parseInt(input));
            renderClubScroll(idealIdx);
            updateShotPattern();
        }
    }

    function resetCalibration() { calibFactor = 1.0; updateCalibUI(); updateShotPattern(); }
    function resetWind() { windStrength = 0; windDir = 'none'; updateWindUI(); updateShotPattern(); }

    function setWindStrength(val) { windStrength = val; updateWindUI(); updateShotPattern(); }
    function setWindDir(dir) { windDir = dir; updateWindUI(); updateShotPattern(); }

    // --- UI UPDATES ---
    function updateCalibUI() {
        var badge = document.getElementById('calibBadge');
        if(Math.abs(calibFactor - 1.0) < 0.01) {
            badge.style.display = 'none';
        } else {
            badge.style.display = 'flex';
            var pct = Math.round((calibFactor - 1) * 100);
            document.getElementById('calibText').innerText = (pct > 0 ? "+" : "") + pct + "% PlaysLike";
        }
    }

    function updateWindUI() {
        document.querySelectorAll('.btn-wind-opt').forEach(b => b.classList.remove('active'));
        if(windStrength>0) document.getElementById('ws-'+windStrength).classList.add('active');
        if(windDir !== 'none') document.getElementById('wd-'+windDir).classList.add('active');

        var badge = document.getElementById('windBadge');
        if(windStrength === 0) {
            badge.style.display = 'none';
            document.getElementById('windIconDisplay').innerText = "💨";
        } else {
            badge.style.display = 'flex';
            var arrow = (windDir==='head'?'⬇️':windDir==='tail'?'⬆️':windDir==='left'?'⬅️':windDir==='right'?'➡️':'⏺');
            var txt = (windStrength===1?'Leicht':windStrength===2?'Mittel':'Stark');
            document.getElementById('windText').innerText = arrow + " " + txt;
            document.getElementById('windIconDisplay').innerText = arrow; 
        }
    }

    function updateShotPattern() {
        if (!startPoint || !targetMarker) return;
        shotLayer.clearLayers();

        var tPos = targetMarker.getLatLng();
        var sPos = L.latLng(startPoint);
        
        var distToTarget = turf.distance(turf.point([sPos.lng, sPos.lat]), turf.point([tPos.lng, tPos.lat]), {units: 'meters'});
        var distToGreen = turf.distance(turf.point([tPos.lng, tPos.lat]), turf.point([greenPoint[1], greenPoint[0]]), {units: 'meters'});
        
        document.getElementById('gpsDistDisplay').innerText = Math.round(distToTarget);
        document.getElementById('greenDistDisplay').innerText = Math.round(distToGreen) + " m Grün";

        // --- PHYSICS UPDATE: DECADE GOLF LOGIC ---
        var windMph = 0;
        if(windStrength === 1) windMph = 8;
        if(windStrength === 2) windMph = 15;
        if(windStrength === 3) windMph = 20;

        var windMod = 0;

        // Headwind: 1 mph = 1% weniger Distanz
        if(windDir === 'head') {
            windMod = -(windMph / 100); 
        }
        
        // Tailwind: 1 mph = 0.5% mehr Distanz (nur die Hälfte!)
        if(windDir === 'tail') {
            windMod = (windMph / 2) / 100;
        }

        // Seitenwind: Minimaler Distanzverlust durch Reibung
        if(windDir === 'left' || windDir === 'right') {
             windMod = -(windMph * 0.1) / 100; 
        }

        var effCarry = (currentClub.carry * (1 + windMod)) / calibFactor;
        var effTotal = (currentClub.total * (1 + windMod)) / calibFactor;

        var sideShiftAngle = 0;
        if(windDir === 'left') sideShiftAngle = 90; 
        if(windDir === 'right') sideShiftAngle = -90;
        
        var driftFactor = 0.008; 
        var driftDist = (windDir === 'left' || windDir === 'right') ? (effTotal * driftFactor * windMph) : 0;
        // -----------------------------------------

        // Drawing
        var startGeo = turf.point([sPos.lng, sPos.lat]);
        var targetGeo = turf.point([tPos.lng, tPos.lat]);
        var aimBearing = turf.bearing(startGeo, targetGeo);

        L.polyline([sPos, tPos], {color: 'white', weight: 1, dashArray: '5,5', opacity: 0.5}).addTo(shotLayer);

        var coneCenterGeo = targetGeo;
        if(driftDist > 0) {
             coneCenterGeo = turf.destination(targetGeo, driftDist/1000, aimBearing + sideShiftAngle);
             L.polyline([tPos, [coneCenterGeo.geometry.coordinates[1], coneCenterGeo.geometry.coordinates[0]]], {color: '#FF453A', weight: 1, opacity: 0.8}).addTo(shotLayer);
        }
        
        var resultBearing = turf.bearing(startGeo, coneCenterGeo);
        var widthAtTotal = currentClub.total * currentClub.spreadFactor; 
        var angleSpread = (widthAtTotal / 2) / (effTotal * 0.01745);

        function getPoint(dist, bearing, angleOffset) {
            var d = turf.destination(startGeo, dist/1000, bearing + angleOffset);
            return [d.geometry.coordinates[1], d.geometry.coordinates[0]];
        }

        var pStart = [sPos.lat, sPos.lng];
        var pCL = getPoint(effCarry, resultBearing, -angleSpread);
        var pCR = getPoint(effCarry, resultBearing, angleSpread);
        var pTL = getPoint(effTotal, resultBearing, -angleSpread);
        var pTR = getPoint(effTotal, resultBearing, angleSpread);

        L.polygon([pStart, pCL, pCR], {color: 'none', fillColor: '#FFD700', fillOpacity: 0.1}).addTo(shotLayer);
        L.polygon([pCL, pTL, pTR, pCR], {color: '#FFD700', weight: 2, fillColor: '#FFD700', fillOpacity: 0.25}).addTo(shotLayer);

        var labelPos = getPoint(effTotal + 5, resultBearing, 0);
        L.marker(labelPos, {
            icon: L.divIcon({ className: 'map-label', html: `${currentClub.name}<br>${Math.round(effTotal)}m`, iconSize: [80, 40], iconAnchor: [40, 20] })
        }).addTo(shotLayer);
    }

    function getIdealClubIndex(gpsDist) { 
        var requiredDist = gpsDist * calibFactor; 
        if(requiredDist > 220) return 0; 
        let b=0,m=999; clubs.forEach((c,i)=>{let d=Math.abs(c.total-requiredDist);if(d<m){m=d;b=i}}); return b; 
    }

    function renderClubScroll(activeIdx) {
        var container = document.getElementById('clubScroll');
        container.innerHTML = '';
        clubs.forEach((c, i) => {
            let el = document.createElement('div');
            el.className = 'club-card' + (c.id===currentClub.id ? ' selected' : '');
            el.id = 'club-card-' + i;
            el.innerHTML = `<span class="club-name">${c.name}</span><span class="club-dist">${c.total}m</span>`;
            el.onclick = () => { selectClub(i); };
            container.appendChild(el);
        });
        setTimeout(() => {
            var activeEl = document.getElementById('club-card-' + activeIdx);
            if(activeEl) activeEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
        }, 100);
    }

    function selectClub(i) {
        var c = clubs[i];
        var tPos = targetMarker.getLatLng();
        var bearing = turf.bearing(turf.point([startPoint[1], startPoint[0]]), turf.point([tPos.lng, tPos.lat]));
        var newDist = c.total / calibFactor; 
        var newLand = turf.destination(turf.point([startPoint[1], startPoint[0]]), newDist/1000, bearing);
        currentClub = c; targetMarker.setLatLng([newLand.geometry.coordinates[1], newLand.geometry.coordinates[0]]);
        renderClubScroll(i); updateShotPattern(); 
    }

    // --- MODALS ---
    function openWindModal() { document.getElementById('windModal').style.display = 'flex'; updateWindUI(); }
    function closeWindModal() { document.getElementById('windModal').style.display = 'none'; }
    
    function openSettingsModal() {
        var body = document.getElementById('distTableBody');
        body.innerHTML = '';
        clubs.forEach(c => { body.innerHTML += `<tr><td>${c.name}</td><td>${c.carry}m</td><td>${c.total}m</td></tr>`; });
        document.getElementById('settingsModal').style.display = 'flex';
    }
    function closeSettingsModal() { document.getElementById('settingsModal').style.display = 'none'; }
    
    function openSelectModal() { openSettingsModal(); }

    async function preloadMapAction() {
        document.getElementById('loader').style.display = 'flex';
        closeSettingsModal();
        var zooms = [16, 17, 18];
        for(let i=1; i<=18; i++) {
            var t = courseData.features.find(f => f.properties.hole === i && f.properties.type === 'tee');
            var g = courseData.features.find(f => f.properties.hole === i && f.properties.type === 'green');
            if(t && g) {
                var p1 = [t.geometry.coordinates[1], t.geometry.coordinates[0]];
                var p2 = [g.geometry.coordinates[1], g.geometry.coordinates[0]];
                for(let z of zooms) {
                    document.getElementById('loadStatus').innerText = `Loch ${i} (Zoom ${z})...`;
                    map.setView(p1, z); await new Promise(r => setTimeout(r, 800));
                    map.setView(p2, z); await new Promise(r => setTimeout(r, 800));
                }
            }
        }
        document.getElementById('loader').style.display = 'none';
        loadHole(1);
    }

    setTimeout(() => { loadHole(1); }, 500);
</script>
